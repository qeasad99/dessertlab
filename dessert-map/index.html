<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dessert Lab | Country of Origin</title>

    <link rel="stylesheet" href="css/origin-map.css" />
    <script src="js/script.js" defer></script>
  </head>

  <body class="origin-demo">
    <main>
      <section class="origin-scroll" id="origin" aria-label="세계의 대표 디저트 여행">
        <div class="origin-sticky">
          <div class="origin-frame" id="originFrame">
            <!-- 세계지도 원본 이미지 -->
            <img
              id="originMap"
              class="origin-map"
              src="img/ChatGPT 이미지 2026년 11월 5일 오후 03_46_08-1.png"
              alt="Country of origin 세계지도"
            />

            <!-- View More 호버 -->
            <a href="subpage.html" class="origin-view-more" aria-label="세계 디저트 자세히 보기">
              <span>View More</span>
            </a>

            <!-- 국가별 핑 -->
            <div class="origin-points" id="originPoints" aria-hidden="true"></div>

            <!-- 디저트 카드 -->
            <article class="dessert-card" id="dessertCard" aria-hidden="true">
              <img id="dessertPhoto" src="" alt="" />

              <div class="dessert-info">
                <span class="dessert-country" id="dessertCountry"></span>

                <strong class="dessert-name" id="dessertName"></strong>
              </div>
            </article>
          </div>

          <!-- 스크롤 진행 표시 -->
          <div class="scroll-indicator" aria-hidden="true">
            <span>SCROLL TO EXPLORE</span>

            <div class="progress-track">
              <div class="progress-fill" id="progressFill"></div>
            </div>

            <span id="progressText">00 / 07</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
